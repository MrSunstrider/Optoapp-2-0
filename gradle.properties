android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Xshare:off
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# Requerido por KSP con AGP actual. Suprime advertencias de kotlin.sourceSets.
android.disallowKotlinSourceSets=false
# org.gradle.java.home — NO agregar aquí. Es específico de cada máquina.
# CI y otros devs tienen Java en distintas rutas. Usar JAVA_HOME env en su lugar.
