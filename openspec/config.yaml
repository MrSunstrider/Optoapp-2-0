# openspec/config.yaml
schema: spec-driven

context: |
  Android app: Kotlin, Jetpack Compose, Hilt DI, KSP, Room, Coroutines+Flow, Clean Architecture (data/domain/presentation)
  Supabase: PostgreSQL 17, RLS policies by optica_id, edge functions (Deno 2), offline-first sync, auth (email+password + Google OAuth)
  Architecture: offline-first with Room → Supabase sync, multi-tenant (optica_id), ViewModel+StateFlow
  Style: Kotlin camelCase/PascalCase, snake_case in Postgres, no AI attributions, conventional commits, code only explains WHY not WHAT

strict_tdd: true

testing:
  strict_tdd: true
  unit_command: ./gradlew :optoapp:testDebugUnitTest --stacktrace
  coverage_command: ./gradlew :optoapp:jacocoTestReport
  build_command: ./gradlew :optoapp:assembleDebug
  lint_command: ./gradlew :optoapp:lintDebug
  format_command: ./gradlew :optoapp:spotlessApply
  frameworks: [junit5, mockk, kotlinx-coroutines-test, room-inmemory]
  notes:
    - No Robolectric for new tests
    - Instrumented tests via androidTest (CI on main push)
    - JaCoCo minimum coverage 5%

rules:
  proposal:
    - Include rollback plan for risky changes
    - Clarify whether Supabase schema or RLS is affected
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex sync flows
    - Document architecture decisions with rationale
  tasks:
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns from AGENTS.md
    tdd: true
    test_command: ./gradlew :optoapp:testDebugUnitTest --stacktrace
  verify:
    test_command: ./gradlew :optoapp:testDebugUnitTest --stacktrace
    build_command: ./gradlew :optoapp:assembleDebug
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
