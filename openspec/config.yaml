# openspec/config.yaml
schema: spec-driven

context: |
  Android app: Kotlin, Jetpack Compose, Hilt DI, KSP, Room, Coroutines+Flow, Clean Architecture (data/domain/presentation)
  Supabase: PostgreSQL 17, RLS policies by optica_id, edge functions (Deno 2), offline-first sync, auth (email+password + Google OAuth)
  Architecture: offline-first with Room → Supabase sync, multi-tenant (optica_id), ViewModel+StateFlow
  Style: Kotlin camelCase/PascalCase, snake_case in Postgres, no AI attributions, conventional commits, code only explains WHY not WHAT

strict_tdd: true

testing:
  runner:
    command: ./gradlew :optoapp:testDebugUnitTest --stacktrace
    framework: JUnit 4 + MockK + kotlinx-coroutines-test
  layers:
    unit: JUnit 4 + MockK + kotlinx-coroutines-test
    integration: Room in-memory + DAO tests
    instrumented: Espresso + Compose UI test + androidTest
    e2e: connectedDebugAndroidTest on CI (emulator, main push only)
  coverage:
    command: ./gradlew :optoapp:jacocoTestReport
    verification_command: ./gradlew :optoapp:jacocoCoverageVerification
    threshold: 0.30
  lint:
    command: ./gradlew :optoapp:lintDebug
  format:
    command: ./gradlew :optoapp:spotlessApply
  build:
    command: ./gradlew :optoapp:assembleDebug

rules:
  proposal:
    - Include rollback plan for risky changes
    - Clarify whether Supabase schema or RLS is affected
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex sync flows
    - Document architecture decisions with rationale
  tasks:
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns from AGENTS.md
    tdd: true
    test_command: ./gradlew :optoapp:testDebugUnitTest --stacktrace
  verify:
    test_command: ./gradlew :optoapp:testDebugUnitTest --stacktrace
    build_command: ./gradlew :optoapp:assembleDebug
    coverage_threshold: 0.30
  archive:
    - Warn before merging destructive deltas
