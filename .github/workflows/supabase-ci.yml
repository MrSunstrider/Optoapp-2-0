name: Supabase CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [version-saas, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - "supabase/tests/**"
      - ".github/workflows/supabase-ci.yml"
  pull_request:
    branches: [version-saas, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - "supabase/tests/**"

# Trigger Scope
# -------------
# Runs only on main/version-saas, not on feature branches. Rationale:
#   - Each branch would need its own `supabase link --project-ref`, adding
#     per-branch infra cost without proportional benefit.
#   - Migration correctness is enforced at PR review time via the pre-commit
#     hook and code review of migration files.
#   - CI validates the definitive integration on push to main/version-saas.

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start
        timeout-minutes: 5

      - name: Lint migrations (advisory)
        run: supabase db lint
        continue-on-error: true

      - name: Check migrations apply cleanly
        run: supabase db reset
        timeout-minutes: 5

      # Management API has an intermittent SchemaError on `inserted_at` timestamp
      # validation in the API keys response — upstream Supabase platform bug.
      # Local validation (lint + reset) is the authoritative gate.
      - name: Link to remote project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF
        continue-on-error: true

      - name: Check migrations are consistent with remote
        run: supabase db diff --linked
        continue-on-error: true
