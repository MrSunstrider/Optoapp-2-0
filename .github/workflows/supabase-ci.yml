name: Supabase CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [version-saas, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - "supabase/tests/**"
      - ".github/workflows/supabase-ci.yml"
  pull_request:
    branches: [version-saas, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - "supabase/tests/**"

# Required Secrets
# ----------------
# SUPABASE_ACCESS_TOKEN  — Supabase personal access token (PAT) for `supabase link --project-ref`
#                         and `supabase db push` authentication.
#                         Create at: https://supabase.com/dashboard/account/tokens
# SUPABASE_DB_PASSWORD   — Password for the local Postgres instance (used by `supabase start`).
#                         Must match the value in your local `.env` or `supabase/` config.
#                         If missing, `supabase start` will prompt or fail.
#
# These secrets must be set in the GitHub repo:
#   Settings → Secrets and variables → Actions → New repository secret

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start
        timeout-minutes: 5

      - name: Lint migrations
        run: supabase db lint

      - name: Check migrations apply cleanly
        run: supabase db reset
        timeout-minutes: 5

      - name: Run schema integrity tests
        run: psql -h localhost -p 54322 -U postgres -d postgres -f supabase/tests/test_schema_integrity.sql
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        timeout-minutes: 2

      - name: Check migrations are consistent with remote
        run: supabase db diff --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
