# Android CI
#
# Runs two independent test suites:
#
# 1. unit-tests  — runs on every push/PR to main/version-saas (touching optoapp/)
# 2. android-test — runs ONLY on push to main/version-saas (emulator is slow)
#
# Required GitHub Secrets:
#   SUPABASE_TEST_URL        — Test Supabase project URL (also injected as supabase.url for production modules)
#   SUPABASE_TEST_ANON_KEY   — Test Supabase anonymous key (also injected as supabase.anon.key)
#   SUPABASE_TEST_SERVICE_KEY — Service-role key for test data cleanup
#
# See openspec/changes/android-e2e-tests/ for the full design and specs.
#
# NOTE: June 2nd 2026 — GitHub removes Node 20 runners.
# All actions updated to versions that target Node 24 natively.
#   actions/checkout@v6, actions/setup-java@v5, actions/upload-artifact@v7
# gradle/actions/setup-gradle@v4 still targets Node 20 — force flag handles it.

name: Android CI

env:
  # gradle/actions/setup-gradle@v4 still targets Node 20;
  # the three other actions are already Node 24 native via their major versions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [main, version-saas]
    paths:
      - "optoapp/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main, version-saas]
    paths:
      - "optoapp/**"

jobs:
  # ────────────────────────────────────────────────────────
  # Job 1: Unit tests — fast, runs on every PR
  # Trigger: push OR pull_request to main/version-saas
  # ────────────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --scan

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --scan

  # ────────────────────────────────────────────────────────
  # Job 2: Android instrumented tests (emulator)
  # Trigger: push to main/version-saas ONLY (not on PRs)
  # NOTE: Does NOT block PR merges — skipped on pull_request
  # ────────────────────────────────────────────────────────
  android-test:
    needs: unit-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Supabase credentials
        run: |
          # Production modules use supabase.url / supabase.anon.key — point them to test project
          echo "supabase.url=${{ secrets.SUPABASE_TEST_URL }}" >> local.properties
          echo "supabase.anon.key=${{ secrets.SUPABASE_TEST_ANON_KEY }}" >> local.properties
          # Test modules use supabase.test.*
          echo "supabase.test.url=${{ secrets.SUPABASE_TEST_URL }}" >> local.properties
          echo "supabase.test.anon.key=${{ secrets.SUPABASE_TEST_ANON_KEY }}" >> local.properties
          echo "supabase.test.service.key=${{ secrets.SUPABASE_TEST_SERVICE_KEY }}" >> local.properties

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          script: ./gradlew :optoapp:connectedDebugAndroidTest --stacktrace --scan

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results-${{ matrix.api-level }}
          path: |
            optoapp/build/outputs/androidTest-results/
            optoapp/build/reports/androidTests/

      - name: Upload emulator logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-logs-${{ matrix.api-level }}
          path: ${{ github.workspace }}/android-emulator-logcat.txt
          if-no-files-found: warn
