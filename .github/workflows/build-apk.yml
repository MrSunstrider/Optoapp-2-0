name: build-apk

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "optoapp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "optoapp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"

      - name: Setup local.properties
        run: |
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "supabase.anon.key=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Decode keystore
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/optoapp-release.keystore"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: chmod +x gradlew && ./gradlew :optoapp:assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/optoapp-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get version name
        id: version
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(grep "versionName" optoapp/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if release tag exists
        id: check_release
        if: github.event_name != 'pull_request'
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo ${{ github.repository }} &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Release
        if: github.event_name != 'pull_request' && steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "OptoApp v${{ steps.version.outputs.version }}"
          body: "Build automático del branch main."
          files: optoapp/build/outputs/apk/release/optoapp-release.apk

      - name: Track release in Supabase
        if: github.event_name != 'pull_request' && steps.check_release.outputs.exists == 'false'
        run: |
          curl -s -X POST "https://sflhtihqdhrlryeyrzdo.supabase.co/functions/v1/track-release" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "${{ steps.version.outputs.version }}",
              "apk_download_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/optoapp-release.apk",
              "release_notes": "Build automático del branch main."
            }'
